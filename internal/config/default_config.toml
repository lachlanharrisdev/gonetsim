# `gonetsim` configuration file
#
# This file is generated automatically the first time you run `gonetsim` if no
# configuration file is found
#
# You can place it in one of the following locations, in order of precedence:
#   Linux:
#     - ./gonetsim.toml
#     - $XDG_CONFIG_HOME/gonetsim/config.toml (usually ~/.config/gonetsim/config.toml)
#     - /etc/gonetsim/gonetsim.toml
#   Windows:
#     - ./gonetsim.toml
#     - %APPDATA%\gonetsim\config.toml
# Or specify an explicit path with:
#   gonetsim --config /path/to/gonetsim.toml

[general]
# How long to wait for servers to shut down after receiving SIGINT/SIGTERM.
shutdown_timeout = "2s"

[dns]
enabled = true
listen = ":53"
# protocol(s) to listen on; "udp", "tcp" or "both"
network = "udp"
# Sinkhole IP for A responses. "auto" detects this machine's IPv4 address
# (falling back to 127.0.0.1), or set an explicit IP.
ipv4 = "auto"
# Optional sinkhole IP for AAAA responses. Set empty string to disable.
ipv6 = "::1"
# Sinkhole domain for CNAME, MX & PTR responses
domain = "localhost"
# TXT record for TXT DNS responses
txt = "TXT record response from GoNetSim"
# TTL in seconds for DNS responses
ttl = 60
# Enable DNS message compression
compress = false

[http]
enabled = true
listen = ":80"
# Status code to return for all requests. 0 means default (200).
status = 200
# fake mode serves a fake file for any request; real mode serves files from the
# directory specified in root_dir (required when mode = "real")
mode = "fake"
root_dir = ""

[https]
enabled = true
listen = ":443"
# Status code to return for all requests. 0 means default (200).
status = 200
# fake mode serves a fake file for any request; real mode serves files from the
# directory specified in root_dir (required when mode = "real")
mode = "fake"
root_dir = ""

[smtp]
enabled = true
listen = ":25"
domain = "localhost"
write_timeout = 10
read_timeout = 10
max_message_bytes = 1048576
max_recipients = 50
require_auth = false
allow_insecure_auth = true
# Log plaintext passwords on successful authentication (warning: security risk)
log_credentials = false

[smtps]
enabled = true
listen = ":465"
domain = "localhost"
write_timeout = 10
read_timeout = 10
max_message_bytes = 1048576
max_recipients = 50
require_auth = false
allow_insecure_auth = false
# Log plaintext passwords on successful authentication (warning: security risk)
log_credentials = false
cert = ""
key = ""

[logging]
# Log output format: "text" or "json".
format = "text"
# Minimum log level: "debug", "info", "warn", "error".
level = "info"

# Custom listeners
#
# Generic TCP/UDP listeners for anything the services above don't cover.
# Run all enabled listeners with `gonetsim`, or a single one with
# `gonetsim run <name>`. Listeners can also be started inline, without any
# configuration, e.g. `gonetsim run echo@:7777` or `gonetsim run c2.lua@:8080`.
#
# Available handlers:
#   builtin:echo  - echo all received data back to the client
#   builtin:sink  - consume and discard all received data
#   lua:<path>    - serve with a Lua script (path relative to this config file)
#
# [[listeners]]
# name = "irc"
# enabled = true
# # protocol; "tcp" (default) or "udp"
# type = "tcp"
# listen = ":6667"
# handler = "lua:handlers/irc.lua"
# # Idle timeout applied to reads and writes on each connection.
# read_timeout = "30s"
# # Wrap the listener in TLS (tcp only). With cert/key empty, a self-signed
# # certificate is generated next to this config file.
# tls = false
# tls_cert = ""
# tls_key = ""
# # Write everything a client sends to the artifacts directory.
# capture = true
