name: ci
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/*.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/*.md'

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: go build
        run: go build ./...
      - name: go test (compile)
        run: go test ./...

  container:
    name: container-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Install ko
        run: go install github.com/google/ko@v0.18.1
      - name: Build container image (ko)
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/gonetsim
          VERSION: dev-${{ github.sha }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ko build --bare --platform=linux/amd64,linux/arm64 --push=false ./cmd/gonetsim